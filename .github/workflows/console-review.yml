name: Console review

on:
  push:
    branches: [ui/automation-home]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  walkthrough:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @daloy/web build
      - run: pnpm exec playwright install --with-deps chromium
      - name: Capture and verify the offline walkthrough
        run: pnpm --filter @daloy/api exec tsx --tsconfig ../../tsconfig.json ../../scripts/console-review/capture.mjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: daloy-console-review
          path: test-results/console-review/console-review.html
          if-no-files-found: error

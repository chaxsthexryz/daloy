services:
  postgres:
    # Pinned by version and digest so a rebuild never picks up a new image silently. Update both together.
    image: postgres:17.12-alpine@sha256:d3244e8ce3f165ee3c93d9c4a4b1d0fe48b3a89e2287b717fdcbbde92d405065
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-daloy}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env (openssl rand -hex 24)}
      POSTGRES_DB: ${POSTGRES_DB:-daloy}
      # Read by docker/postgres-init/10-app-role.sh, which creates the DML-only role daloy_app on first start.
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:?set APP_DB_PASSWORD in .env (openssl rand -hex 24)}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres-init:/docker-entrypoint-initdb.d:ro
      - ./docker/app-role.sql:/daloy/app-role.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  mailpit:
    # Catches all outgoing mail locally. Web UI on http://localhost:8025
    image: axllent/mailpit:v1.33.1@sha256:aef2aacc11f075ec0fb6874275ee4a421e688e11a96ebb296134d1735c7761ce
    ports:
      - "127.0.0.1:1025:1025"
      - "127.0.0.1:8025:8025"

  # One-shot: migrations, pg-boss install and queues, as the owner role. The api and worker wait for it (decision 0013).
  migrate:
    build:
      context: .
      args:
        APP: worker
    command: ["node_modules/.bin/tsx", "src/migrate.ts"]
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-daloy}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-daloy}
    depends_on:
      postgres:
        condition: service_healthy

  worker:
    build:
      context: .
      args:
        APP: worker
    environment:
      DATABASE_URL: postgres://daloy_app:${APP_DB_PASSWORD}@postgres:5432/${POSTGRES_DB:-daloy}
      MIGRATE_ON_BOOT: "false"
      SECRETS_KEY: ${SECRETS_KEY:?set SECRETS_KEY in .env (openssl rand -base64 32)}
      # Mailpit unless .env names a real SMTP server (see .env.example).
      SMTP_HOST: ${SMTP_HOST:-mailpit}
      SMTP_PORT: ${SMTP_PORT:-1025}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-Daloy <daloy@localhost>}
      # Who may use that server: empty picks open for Mailpit and approved for anything else (decision 0024).
      SHARED_MAIL: ${SHARED_MAIL:-}
      # Ollama on the host by default. The AI step works without it only in test runs without live calls.
      LLM_BASE_URL: ${LLM_BASE_URL:-http://host.docker.internal:11434}
      LLM_MODEL: ${LLM_MODEL:-llama3.2}
      LLM_PROVIDER: ${LLM_PROVIDER:-ollama}
      LLM_API_KEY: ${LLM_API_KEY:-}
      # open lets accounts without their own AI key use LLM_API_KEY. Leave it off on a public installation (decision 0035).
      SHARED_LLM_KEY: ${SHARED_LLM_KEY:-off}
      # Comma list of the only hosts an HTTP step may call, for the public demo. Empty means any public host.
      HTTP_ALLOWED_HOSTS: ${HTTP_ALLOWED_HOSTS:-}
      PUBLIC_URL: ${PUBLIC_URL:-http://localhost:3000}
      # Optional: the installation's Microsoft Entra app, for Connect Outlook (decision 0023). Empty means Outlook is not offered.
      MICROSOFT_CLIENT_ID: ${MICROSOFT_CLIENT_ID:-}
      MICROSOFT_CLIENT_SECRET: ${MICROSOFT_CLIENT_SECRET:-}
      MICROSOFT_TENANT: ${MICROSOFT_TENANT:-organizations}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      migrate:
        condition: service_completed_successfully
    # Longer than the worker's 30 second graceful shutdown.
    stop_grace_period: 40s

  api:
    build:
      context: .
      args:
        APP: api
    environment:
      DATABASE_URL: postgres://daloy_app:${APP_DB_PASSWORD}@postgres:5432/${POSTGRES_DB:-daloy}
      MIGRATE_ON_BOOT: "false"
      SECRETS_KEY: ${SECRETS_KEY:?set SECRETS_KEY in .env (openssl rand -base64 32)}
      WEB_DIST: /app/apps/web/dist
      # For "Send a test email to me" on the Business and email page. Same defaults as the worker.
      SMTP_HOST: ${SMTP_HOST:-mailpit}
      SMTP_PORT: ${SMTP_PORT:-1025}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-Daloy <daloy@localhost>}
      # Who may use that server: empty picks open for Mailpit and approved for anything else (decision 0024).
      SHARED_MAIL: ${SHARED_MAIL:-}
      PUBLIC_URL: ${PUBLIC_URL:-http://localhost:3000}
      # Optional: the installation's Microsoft Entra app, for Connect Outlook (decision 0023). Empty means Outlook is not offered.
      MICROSOFT_CLIENT_ID: ${MICROSOFT_CLIENT_ID:-}
      MICROSOFT_CLIENT_SECRET: ${MICROSOFT_CLIENT_SECRET:-}
      MICROSOFT_TENANT: ${MICROSOFT_TENANT:-organizations}
      # For the "Test" button on the AI model page. Same defaults as the worker.
      LLM_BASE_URL: ${LLM_BASE_URL:-http://host.docker.internal:11434}
      LLM_MODEL: ${LLM_MODEL:-llama3.2}
      LLM_PROVIDER: ${LLM_PROVIDER:-ollama}
      LLM_API_KEY: ${LLM_API_KEY:-}
      SHARED_LLM_KEY: ${SHARED_LLM_KEY:-off}
      # on turns on "Ask about a request" in Build with AI (decision 0041). Keep off until docs/ai-ask-measurement.md is done.
      AI_ASK: ${AI_ASK:-off}
      # Behind cloudflared or Caddy: 1, so rate limits key on the real client (docs/deployment.md). 0 when nothing is in front.
      TRUST_PROXY: ${TRUST_PROXY:-0}
      # true on any installation served over HTTPS, so the session cookie is only sent over HTTPS.
      SECURE_COOKIES: ${SECURE_COOKIES:-false}
      # Sign-ups per client IP per hour.
      REGISTER_LIMIT_PER_HOUR: ${REGISTER_LIMIT_PER_HOUR:-10}
      # none: new sign-ups have no plan and no limits. Empty: the preview plan (docs/decisions/0057-public-intake-fixes.md).
      SIGNUP_PLAN: ${SIGNUP_PLAN:-}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      migrate:
        condition: service_completed_successfully

volumes:
  pgdata:

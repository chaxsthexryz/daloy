services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-daloy}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-daloy}
      POSTGRES_DB: ${POSTGRES_DB:-daloy}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  mailpit:
    # Catches all outgoing mail locally. Web UI on http://localhost:8025
    image: axllent/mailpit:latest
    ports:
      - "127.0.0.1:1025:1025"
      - "127.0.0.1:8025:8025"

  worker:
    build:
      context: .
      args:
        APP: worker
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-daloy}:${POSTGRES_PASSWORD:-daloy}@postgres:5432/${POSTGRES_DB:-daloy}
      SECRETS_KEY: ${SECRETS_KEY:?set SECRETS_KEY in .env (openssl rand -base64 32)}
      SMTP_HOST: mailpit
      SMTP_PORT: 1025
      SMTP_FROM: ${SMTP_FROM:-Daloy <daloy@localhost>}
      # Ollama on the host by default. The AI step works without it only in test runs without live calls.
      LLM_BASE_URL: ${LLM_BASE_URL:-http://host.docker.internal:11434}
      LLM_MODEL: ${LLM_MODEL:-llama3.2}
      PUBLIC_URL: ${PUBLIC_URL:-http://localhost:3000}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy
    # Longer than the worker's 30 second graceful shutdown.
    stop_grace_period: 40s

  api:
    build:
      context: .
      args:
        APP: api
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-daloy}:${POSTGRES_PASSWORD:-daloy}@postgres:5432/${POSTGRES_DB:-daloy}
      SECRETS_KEY: ${SECRETS_KEY:?set SECRETS_KEY in .env (openssl rand -base64 32)}
      WEB_DIST: /app/apps/web/dist
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:

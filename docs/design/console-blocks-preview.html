<!doctype html>
<html lang="en" data-theme="light" data-motion="on" data-font="geist">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>kymavo · Full Console Preview</title>
<style>
@font-face {
  font-family: "Geist";
  src: url("fonts/geist.woff2") format("woff2");
  font-weight: 100 900;
  font-style: normal;
  font-display: swap;
}
@font-face {
  font-family: "Inter";
  src: url("../../apps/web/public/fonts/inter-variable.woff2") format("woff2");
  font-weight: 100 900;
  font-style: normal;
  font-display: swap;
}
@font-face {
  font-family: "IBM Plex Mono";
  src: url("fonts/ibm-plex-mono-400.woff2") format("woff2");
  font-weight: 400;
  font-style: normal;
  font-display: swap;
}
@font-face {
  font-family: "IBM Plex Mono";
  src: url("fonts/ibm-plex-mono-500.woff2") format("woff2");
  font-weight: 500;
  font-style: normal;
  font-display: swap;
}

:root {
  --bg: #fafafa;
  --surface: #ffffff;
  --text: #0f131a;
  --muted: #5b6372;
  --border: #d1d5df;
  --border-soft: #e6e8ee;
  --sunken: #f4f5f7;
  --accent: #0b66ff;
  --accent-hover: #0052d9;
  --accent-tint: #eef4ff;
  --on-accent: #ffffff;
  --ok: #15803d;
  --ok-bg: #ecfdf3;
  --warn: #685500;
  --warn-bg: #fffbe6;
  --warn-dot: #eab308;
  --bad: #c92a2a;
  --bad-bg: #fff1f1;
  --shadow-card: 0 1px 3px rgb(15 19 26 / 0.05);
  --shadow-overlay: 0 12px 32px rgb(15 19 26 / 0.14);
  --ease: cubic-bezier(0.32, 0.72, 0, 1);
  --ease-spring: cubic-bezier(0.22, 1, 0.36, 1);
  --ease-snappy: cubic-bezier(0.34, 1.56, 0.64, 1);
  --font-sans: "Geist", "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --font-mono: "IBM Plex Mono", "Cascadia Mono", Consolas, monospace;
}
:root[data-font="inter"] { --font-sans: "Inter", "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
:root[data-font="system"] { --font-sans: "Segoe UI", system-ui, -apple-system, sans-serif; }

:root[data-theme="dark"] {
  --bg: #09090b;
  --surface: #111216;
  --text: #fafafa;
  --muted: #a1a1aa;
  --border: #3f3f46;
  --border-soft: #27272a;
  --sunken: #181a20;
  --accent: #5c9cff;
  --accent-hover: #8cb9ff;
  --accent-tint: #17233b;
  --on-accent: #091020;
  --ok: #6ee7b7;
  --ok-bg: #132c21;
  --warn: #fde047;
  --warn-bg: #332c0a;
  --warn-dot: #facc15;
  --bad: #fca5a5;
  --bad-bg: #3a1718;
  --shadow-card: 0 1px 3px rgb(0 0 0 / 0.25);
  --shadow-overlay: 0 12px 36px rgb(0 0 0 / 0.55);
}

* { box-sizing: border-box; }
html, body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font-family: var(--font-sans);
  font-size: 13.5px;
  line-height: 1.45;
  font-weight: 400;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
  font-optical-sizing: auto;
  font-synthesis: none;
}
strong, b { font-weight: 600; }
.tnum { font-variant-numeric: tabular-nums; }
.mono, .mono strong { font-family: var(--font-mono); font-weight: 500; }

/* Motion primitives */
.motion-page { animation: motion-page-in 260ms var(--ease-spring) both; }
.motion-dialog { animation: motion-dialog-in 200ms var(--ease-spring) both; }
.motion-drawer { animation: motion-drawer-in 320ms var(--ease-spring) both; }
.motion-stagger-row { animation: daloy-fade-up 220ms var(--ease-spring) both; animation-delay: calc(var(--i, 0) * 24ms); }
.motion-spark-bar { transform-origin: bottom; animation: daloy-spark-rise 400ms var(--ease-spring) both; animation-delay: calc(var(--bi, 0) * 28ms); }
.motion-toast { animation: daloy-toast-in 240ms var(--ease-spring) both; }
.motion-pill {
  position: absolute;
  top: 0;
  left: 0;
  pointer-events: none;
  z-index: 0;
  border-radius: 9px;
  background: var(--sunken);
  transition: transform 220ms var(--ease-spring), width 220ms var(--ease-spring), height 220ms var(--ease-spring), opacity 140ms ease;
}

@keyframes motion-page-in { from { opacity: 0; transform: translateY(5px); } }
@keyframes motion-dialog-in { from { opacity: 0; transform: scale(0.985); } }
@keyframes motion-drawer-in { from { opacity: 0; transform: translateX(24px); } }
@keyframes daloy-fade-up { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }
@keyframes daloy-spark-rise { from { transform: scaleY(0); } to { transform: scaleY(1); } }
@keyframes daloy-toast-in { from { opacity: 0; transform: translateY(10px) scale(0.98); } to { opacity: 1; transform: translateY(0) scale(1); } }
@keyframes line-draw { from { stroke-dashoffset: 900; } to { stroke-dashoffset: 0; } }
@keyframes pulse-ring { 0%, 100% { box-shadow: 0 0 0 0 color-mix(in srgb, var(--ok) 35%, transparent); } 50% { box-shadow: 0 0 0 5px color-mix(in srgb, var(--ok) 0%, transparent); } }

:root[data-motion="reduced"] *,
:root[data-motion="reduced"] *::before,
:root[data-motion="reduced"] *::after {
  animation: none !important;
  transition-duration: 0s !important;
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition-duration: 0s !important; }
}

/* Preview toolbar */
.preview-bar {
  position: sticky;
  top: 0;
  z-index: 60;
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  padding: 7px 16px;
  background: var(--surface);
  border-bottom: 1px solid var(--border-soft);
}
.preview-title { display: flex; align-items: center; gap: 8px; font-weight: 600; font-size: 12.5px; }
.preview-controls { display: flex; flex-wrap: nowrap; align-items: center; gap: 6px; overflow-x: auto; scrollbar-width: none; }
.p-seg {
  display: inline-flex;
  padding: 2px;
  gap: 2px;
  border: 1px solid var(--border-soft);
  border-radius: 9px;
  background: var(--bg);
}
.p-btn {
  min-height: 25px;
  padding: 0 9px;
  border: 1px solid transparent;
  border-radius: 7px;
  background: transparent;
  color: var(--muted);
  font: 500 11.5px/1 var(--font-sans);
  cursor: pointer;
  white-space: nowrap;
  transition: color 140ms ease, background-color 140ms ease;
}
.p-btn:hover { color: var(--text); }
.p-btn[aria-pressed="true"] {
  background: var(--surface);
  color: var(--text);
  border-color: var(--border-soft);
  font-weight: 600;
}

/* Stage & Viewport */
.stage { padding: 6px 12px; display: flex; justify-content: center; }
.viewport {
  position: relative;
  width: 100%;
  max-width: 1420px;
  border: 1px solid var(--border-soft);
  border-radius: 16px;
  overflow: hidden;
  background: var(--bg);
  transition: max-width 260ms var(--ease-spring);
}
.viewport[data-mode="desktop"] {
  height: calc(100dvh - 66px);
  min-height: 620px;
  max-height: 880px;
}
.viewport[data-mode="phone"] {
  max-width: 390px;
  height: min(812px, calc(100dvh - 66px));
  min-height: 640px;
  border-radius: 28px;
  border-width: 2px;
  overflow: hidden;
}

/* Console Shell */
.shell { display: flex; height: 100%; background: var(--bg); position: relative; }
.sidebar {
  width: 224px;
  flex: none;
  display: flex;
  flex-direction: column;
  padding: 14px 10px 12px;
  background: transparent;
  height: 100%;
  overflow-y: auto;
  scrollbar-width: none;
}
.sidebar-top { display: flex; align-items: center; gap: 8px; padding: 2px 4px 10px; }
.rail-brand { width: 26px; height: 26px; color: var(--accent); flex: none; }
.sidebar-name { font-size: 15.5px; font-weight: 600; letter-spacing: -0.02em; }

.rail-search {
  display: flex;
  align-items: center;
  gap: 8px;
  width: 100%;
  min-height: 34px;
  margin: 0 0 8px;
  padding: 0 10px;
  border: 1px solid var(--border-soft);
  border-radius: 9px;
  background: var(--surface);
  color: var(--muted);
  font: 500 12.5px/1 var(--font-sans);
  cursor: pointer;
  transition: border-color 140ms ease, color 140ms ease;
}
.rail-search:hover { border-color: var(--border); color: var(--text); }
.rail-search kbd {
  margin-left: auto;
  padding: 2px 5px;
  border: 1px solid var(--border-soft);
  border-radius: 5px;
  background: var(--sunken);
  font-family: var(--font-sans);
  font-size: 10.5px;
  font-weight: 500;
}

.rail-nav { position: relative; display: flex; flex-direction: column; gap: 1px; flex: 1; }
.rail-group-label {
  position: relative;
  z-index: 1;
  padding: 8px 10px 3px;
  font-size: 10.5px;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.06em;
  color: var(--muted);
}
.rail-group-label:first-of-type { padding-top: 2px; }
.rail-link {
  position: relative;
  z-index: 1;
  display: flex;
  align-items: center;
  gap: 9px;
  width: 100%;
  min-height: 33px;
  padding: 0 10px;
  border: 1px solid transparent;
  border-radius: 9px;
  background: transparent;
  color: var(--muted);
  text-decoration: none;
  font-family: var(--font-sans);
  font-size: 13px;
  font-weight: 500;
  text-align: left;
  cursor: pointer;
  transition: color 140ms ease;
}
.rail-link:hover { color: var(--text); }
.rail-link[aria-current="page"] {
  background: var(--accent-tint);
  color: var(--accent);
  border-color: color-mix(in srgb, var(--accent) 18%, transparent);
  font-weight: 600;
}
.rail-link svg { width: 16px; height: 16px; flex: none; }
.rail-chevron {
  margin-left: auto;
  width: 13px !important;
  height: 13px !important;
  color: var(--muted);
  transition: transform 180ms var(--ease-spring), color 140ms ease;
}
.rail-group { display: flex; flex-direction: column; }
.rail-group[data-has-active="true"] > .rail-parent { color: var(--text); font-weight: 600; }
.rail-group[data-open="true"] > .rail-parent .rail-chevron { transform: rotate(90deg); color: var(--text); }
.rail-children-wrap {
  display: grid;
  grid-template-rows: 0fr;
  transition: grid-template-rows 200ms var(--ease-spring);
}
.rail-group[data-open="true"] > .rail-children-wrap { grid-template-rows: 1fr; }
.rail-children {
  overflow: hidden;
  margin: 2px 0 3px 17px;
  padding-left: 10px;
  border-left: 1px solid var(--border-soft);
  display: flex;
  flex-direction: column;
  gap: 1px;
}
.rail-sublink {
  position: relative;
  z-index: 1;
  display: flex;
  align-items: center;
  min-height: 29px;
  padding: 0 9px;
  border: 1px solid transparent;
  border-radius: 8px;
  color: var(--muted);
  text-decoration: none;
  font-size: 12.5px;
  font-weight: 500;
  cursor: pointer;
  transition: color 120ms ease, background-color 120ms ease;
}
.rail-sublink:hover { color: var(--text); }
.rail-sublink[aria-current="page"] {
  background: var(--accent-tint);
  color: var(--accent);
  border-color: color-mix(in srgb, var(--accent) 18%, transparent);
  font-weight: 600;
}
.rail-badge {
  margin-left: auto;
  min-width: 19px;
  height: 19px;
  padding: 0 5px;
  border-radius: 999px;
  background: var(--accent);
  color: var(--on-accent);
  font-size: 11px;
  font-weight: 600;
  line-height: 19px;
  text-align: center;
}

.rail-usage {
  position: relative;
  z-index: 1;
  margin: auto 0 8px;
  padding: 10px 11px;
  border: 1px solid var(--border-soft);
  border-radius: 11px;
  background: var(--surface);
}
.rail-usage-head { display: flex; justify-content: space-between; margin-bottom: 6px; font-size: 12px; }
.rail-usage-head strong { font-weight: 600; }
.rail-usage-head span { font-size: 11px; color: var(--muted); }
.meter-bar { height: 4px; border-radius: 99px; background: var(--sunken); overflow: hidden; }
.meter-bar i { display: block; height: 100%; width: 24%; background: var(--accent); border-radius: 99px; }
.meter-text { display: block; margin-top: 6px; font-size: 11px; color: var(--muted); }
.rail-usage-btn {
  display: flex;
  align-items: center;
  justify-content: center;
  min-height: 27px;
  margin-top: 8px;
  width: 100%;
  border: 1px solid var(--border-soft);
  border-radius: 7px;
  background: var(--sunken);
  color: var(--text);
  font-family: inherit;
  font-size: 11.5px;
  font-weight: 500;
  cursor: pointer;
}
.rail-usage-btn:hover { border-color: var(--border); background: var(--surface); }

.rail-account {
  position: relative;
  display: flex;
  align-items: center;
  gap: 8px;
  padding-top: 10px;
  border-top: 1px solid var(--border-soft);
}
.rail-avatar {
  width: 30px;
  height: 30px;
  border-radius: 50%;
  display: grid;
  place-items: center;
  background: var(--accent-tint);
  color: var(--accent);
  font-weight: 600;
  font-size: 12.5px;
  flex: none;
}
.rail-who { min-width: 0; flex: 1; }
.rail-who strong { display: block; font-size: 12px; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.rail-who-links { display: flex; gap: 5px; font-size: 11px; color: var(--muted); }
.rail-who-links button { border: 0; padding: 0; background: transparent; color: var(--muted); font: inherit; cursor: pointer; }
.rail-who-links button:hover { color: var(--text); text-decoration: underline; }
.rail-help-btn {
  width: 24px;
  height: 24px;
  border-radius: 999px;
  border: 1px solid var(--border-soft);
  background: var(--surface);
  color: var(--muted);
  font-weight: 600;
  font-size: 11.5px;
  cursor: pointer;
  flex: none;
}
.rail-help-btn:hover { border-color: var(--border); color: var(--text); }

/* Floating rounded workspace frame */
.shell-main { flex: 1; min-width: 0; height: 100%; padding: 10px 10px 10px 0; }
.shell-frame {
  background: var(--surface);
  border: 1px solid var(--border-soft);
  border-radius: 14px;
  height: 100%;
  overflow: hidden;
  display: flex;
  flex-direction: column;
}

/* Unified Page Head & Body */
.page-head {
  flex: none;
  display: grid;
  grid-template-columns: minmax(0, 1fr) auto;
  align-items: center;
  gap: 4px 14px;
  padding: 13px 22px 12px;
  background: var(--surface);
  border-bottom: 1px solid var(--border-soft);
}
.page-head.tabbed { padding-bottom: 0; align-items: end; }
.page-head h1 { margin: 0; font-size: 21px; line-height: 1.15; font-weight: 600; letter-spacing: -0.025em; }
.page-head p { margin: 2px 0 0; font-size: 12.5px; color: var(--muted); }
.head-actions { display: flex; flex-wrap: wrap; gap: 8px; }
.tabs { grid-column: 1 / -1; display: flex; flex-wrap: wrap; gap: 20px; margin-top: 6px; }
.tab-btn {
  min-height: 36px;
  padding: 0 0 4px;
  border: 0;
  border-bottom: 2px solid transparent;
  background: transparent;
  color: var(--muted);
  font: 500 13.5px var(--font-sans);
  cursor: pointer;
  transition: color 140ms ease, border-color 140ms ease;
}
.tab-btn:hover { color: var(--text); }
.tab-btn[aria-current="page"] { color: var(--text); font-weight: 600; border-bottom-color: var(--accent); }

.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  min-height: 32px;
  padding: 0 12px;
  border: 1px solid var(--border);
  border-radius: 8px;
  background: var(--surface);
  color: var(--text);
  font: 500 12.5px/1 var(--font-sans);
  text-decoration: none;
  cursor: pointer;
  transition: background-color 120ms ease, border-color 120ms ease, transform 120ms var(--ease-spring);
}
.btn:hover:not(:disabled) { background: var(--bg); }
.btn:active:not(:disabled) { transform: scale(0.98); }
.btn.blue { background: var(--accent); border-color: var(--accent); color: var(--on-accent); font-weight: 600; }
.btn.blue:hover:not(:disabled) { background: var(--accent-hover); border-color: var(--accent-hover); }
.btn.danger { color: var(--bad); border-color: var(--bad); }
.btn.sm { min-height: 28px; padding: 0 10px; font-size: 12px; border-radius: 7px; }

.input, .select, .textarea {
  min-height: 34px;
  padding: 0 11px;
  border: 1px solid var(--border);
  border-radius: 8px;
  background: var(--surface);
  color: var(--text);
  font: 400 13px/1.3 var(--font-sans);
  transition: border-color 140ms ease, box-shadow 140ms ease;
}
.input:focus, .select:focus, .textarea:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-tint); }
.textarea { min-height: 92px; padding: 10px 12px; resize: vertical; width: 100%; }

.body {
  flex: 1;
  min-height: 0;
  overflow-y: auto;
  display: flex;
  flex-direction: column;
  gap: 14px;
  padding: 16px 22px 24px;
  background: var(--bg);
}
.body:not(.home-fit) > * { flex: none; }

/* Home Zero-Scroll Fit */
.body.home-fit {
  display: grid;
  grid-template-rows: auto minmax(0, 1.05fr) minmax(0, 0.95fr);
  gap: 11px;
  padding: 12px 20px 14px;
  overflow: hidden;
}
.viewport[data-mode="phone"] .body.home-fit {
  display: flex;
  flex-direction: column;
  overflow: visible;
}

/* Unified Card & Block Primitives */
.card {
  display: flex;
  flex-direction: column;
  gap: 12px;
  padding: 16px 18px;
  background: var(--surface);
  border: 1px solid var(--border-soft);
  border-radius: 12px;
  min-width: 0;
  min-height: 0;
}
.body.home-fit .card { padding: 12px 15px; gap: 8px; }
.card-head { display: flex; align-items: center; gap: 9px; flex-wrap: wrap; flex: none; }
.card-head h2, .card-head h3 { margin: 0; font-size: 15px; font-weight: 600; letter-spacing: -0.015em; }
.card-ico {
  width: 28px;
  height: 28px;
  border: 1px solid var(--border-soft);
  border-radius: 8px;
  background: var(--bg);
  color: var(--muted);
  display: grid;
  place-items: center;
  flex: none;
}
.card-ico svg { width: 14px; height: 14px; }
.card-link {
  margin-left: auto;
  display: inline-flex;
  align-items: center;
  gap: 4px;
  min-height: 26px;
  padding: 0 10px;
  border: 1px solid var(--border-soft);
  border-radius: 7px;
  background: var(--bg);
  color: var(--text);
  font: 500 12px/1 var(--font-sans);
  text-decoration: none;
  cursor: pointer;
  transition: border-color 140ms ease, background-color 140ms ease;
}
.card-link:hover { border-color: var(--border); background: var(--surface); text-decoration: none; }

.pill {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  padding: 2px 8px;
  border-radius: 999px;
  font-size: 11px;
  font-weight: 600;
  line-height: 15px;
  white-space: nowrap;
}
.pill i.dot { width: 6px; height: 6px; border-radius: 99px; background: currentColor; display: inline-block; }
.pill.ok { background: var(--ok-bg); color: var(--ok); }
.pill.warn { background: var(--warn-bg); color: var(--warn); }
.pill.warn i.dot { background: var(--warn-dot); }
.pill.bad { background: var(--bad-bg); color: var(--bad); }
.pill.blue { background: var(--accent-tint); color: var(--accent); }
.pill.neutral { background: var(--bg); color: var(--muted); border: 1px solid var(--border-soft); }

/* Compressed KPI Grid */
.kpi-grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 11px; }
.kpi-card {
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  background: var(--surface);
  border: 1px solid var(--border-soft);
  border-radius: 11px;
  overflow: hidden;
  transition: border-color 140ms ease;
}
.kpi-card:hover { border-color: var(--border); }
.kpi-top { display: flex; align-items: flex-start; justify-content: space-between; gap: 8px; padding: 11px 14px 9px; }
.kpi-label { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; color: var(--muted); font-weight: 500; }
.live-pulse { width: 6px; height: 6px; border-radius: 99px; background: var(--ok); animation: pulse-ring 2s ease-in-out infinite; }
.kpi-val { display: flex; flex-wrap: wrap; align-items: baseline; gap: 7px; margin-top: 5px; }
.kpi-val strong { font-size: 23px; font-weight: 600; line-height: 1; letter-spacing: -0.025em; }
.kpi-ico {
  width: 30px;
  height: 30px;
  border: 1px solid var(--border-soft);
  border-radius: 8px;
  background: var(--bg);
  color: var(--muted);
  display: grid;
  place-items: center;
  flex: none;
}
.kpi-ico svg { width: 15px; height: 15px; }
.kpi-foot {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 6px 14px;
  border-top: 1px solid var(--border-soft);
  font-size: 12px;
  color: var(--muted);
  cursor: pointer;
  background: transparent;
  border-left: 0;
  border-right: 0;
  border-bottom: 0;
  width: 100%;
  font-family: inherit;
}
.kpi-foot:hover { background: var(--bg); color: var(--text); }

/* Home Bento Rows */
.bento-mid { display: grid; grid-template-columns: minmax(0, 1.85fr) minmax(0, 1fr); gap: 11px; min-height: 0; }
.bento-bot { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.85fr); gap: 11px; min-height: 0; }

.trend-inline-tip {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 2px 9px;
  border: 1px solid var(--border-soft);
  border-radius: 999px;
  background: var(--bg);
  font-size: 11.5px;
}
.chart-box { flex: 1; min-height: 0; display: flex; flex-direction: column; justify-content: space-between; gap: 4px; position: relative; }
.chart-stage { position: relative; flex: 1; min-height: 92px; max-height: 132px; display: flex; }
.area-svg { width: 100%; height: 100%; display: block; overflow: visible; }
.gridline { stroke: var(--border-soft); stroke-width: 1; stroke-dasharray: 4 4; }
.area-line { fill: none; stroke: var(--accent); stroke-width: 2; stroke-linecap: round; stroke-dasharray: 900; stroke-dashoffset: 0; animation: line-draw 700ms var(--ease-spring) both; }
.focus-stem { stroke: var(--border); stroke-width: 1.5; transition: all 180ms var(--ease-spring); pointer-events: none; }
.focus-halo { fill: color-mix(in srgb, var(--accent) 18%, transparent); transition: all 180ms var(--ease-spring); pointer-events: none; }
.focus-dot { fill: var(--accent); stroke: var(--surface); stroke-width: 2.5; transition: all 180ms var(--ease-spring); pointer-events: none; }
.chart-hit { fill: transparent; cursor: ew-resize; }
.chart-tip {
  position: absolute;
  top: 6px;
  left: 50%;
  transform: translate(-50%, 4px);
  z-index: 5;
  pointer-events: none;
  min-width: 156px;
  padding: 6px 10px;
  border: 1px solid var(--border);
  border-radius: 9px;
  background: var(--surface);
  color: var(--text);
  box-shadow: var(--shadow-overlay);
  font-size: 11.5px;
  opacity: 0;
  transition: opacity 110ms ease, left 140ms var(--ease-spring), transform 140ms var(--ease-spring);
}
.chart-tip[data-open="true"] { opacity: 1; transform: translate(-50%, 0); }
.chart-tip-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 2px; }
.chart-tip-sub { display: flex; align-items: center; gap: 8px; font-size: 11px; color: var(--muted); }
.day-row { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; flex: none; }
.day-btn {
  min-height: 23px;
  border: 1px solid transparent;
  border-radius: 6px;
  background: transparent;
  color: var(--muted);
  font: 500 11.5px/1 var(--font-sans);
  cursor: pointer;
}
.day-btn:hover { background: var(--bg); color: var(--text); }
.day-btn[aria-pressed="true"] { background: var(--accent-tint); color: var(--accent); font-weight: 600; }

.running-strip {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  padding-top: 7px;
  border-top: 1px solid var(--border-soft);
  flex: none;
}
.running-chip {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 4px 9px;
  border: 1px solid var(--border-soft);
  border-radius: 7px;
  background: var(--bg);
  font-size: 11.5px;
  color: var(--text);
  text-decoration: none;
}
.running-chip span { color: var(--muted); }
.running-chip:hover { border-color: var(--accent); }

.donut-wrap { flex: 1; min-height: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; }
.donut-legend { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px 12px; font-size: 11.5px; color: var(--muted); }
.donut-legend span { display: inline-flex; align-items: center; gap: 5px; }
.donut-legend i { width: 8px; height: 8px; border-radius: 2px; display: inline-block; }

.apps-list { list-style: none; margin: 0; padding: 0; display: grid; gap: 7px; }
.app-row {
  display: flex;
  align-items: center;
  gap: 9px;
  padding: 7px 10px;
  border: 1px solid var(--border-soft);
  border-radius: 9px;
  background: var(--surface);
  color: var(--text);
  text-decoration: none;
  transition: border-color 140ms ease, background-color 140ms ease;
}
.app-row:hover { border-color: var(--border); background: var(--bg); }
.app-mark {
  width: 26px;
  height: 26px;
  border: 1px solid var(--border-soft);
  border-radius: 7px;
  background: #ffffff;
  display: grid;
  place-items: center;
  flex: none;
}
:root[data-theme="dark"] .app-mark { background: #e2e6f0; border-color: var(--border); }
.app-mark img { width: 16px; height: 16px; display: block; }
.app-row-name { flex: 1; font-size: 13px; font-weight: 500; }

/* Tables */
.table-wrap { border: 1px solid var(--border-soft); border-radius: 10px; overflow: hidden; background: var(--surface); }
table { width: 100%; border-collapse: collapse; }
th, td { padding: 9px 13px; text-align: left; font-size: 12.5px; border-bottom: 1px solid var(--border-soft); vertical-align: middle; }
.body.home-fit th, .body.home-fit td { padding: 7px 11px; }
thead th { background: var(--bg); font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.04em; color: var(--muted); }
tbody tr:last-child td { border-bottom: 0; }
tbody tr:hover { background: var(--bg); }
.ref-cell { font-family: var(--font-mono); font-weight: 500; font-size: 12px; white-space: nowrap; }

/* Clean separated queue cards (replaces jarring blue box on Bookings & Inbox) */
.split-2 { display: grid; grid-template-columns: minmax(0, 1.1fr) minmax(320px, 1fr); gap: 16px; align-items: start; }
.queue-list { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
.queue-btn {
  width: 100%;
  display: flex;
  flex-direction: column;
  gap: 5px;
  padding: 13px 15px;
  border: 1px solid var(--border-soft);
  border-radius: 11px;
  background: var(--surface);
  color: var(--text);
  text-align: left;
  cursor: pointer;
  transition: border-color 140ms ease, box-shadow 140ms ease, background-color 140ms ease;
}
.queue-btn:hover { border-color: var(--border); background: var(--bg); }
.queue-btn[aria-pressed="true"] {
  background: var(--surface);
  border-color: var(--border);
  box-shadow: var(--shadow-card);
}
.active-dot {
  width: 7px;
  height: 7px;
  border-radius: 99px;
  background: var(--accent);
  display: inline-block;
  flex: none;
}

.thread { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
.thread li { padding: 10px 12px; border-radius: 9px; background: var(--bg); border: 1px solid var(--border-soft); font-size: 13px; }
.thread li[data-dir="in"] { border-left: 3px solid var(--accent); }

/* Quick-start 3-card strip */
.quick-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
.quick-card {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 13px 15px;
  border: 1px solid var(--border-soft);
  border-radius: 11px;
  background: var(--surface);
  color: var(--text);
  text-decoration: none;
  cursor: pointer;
  transition: border-color 140ms ease, background-color 140ms ease, transform 140ms var(--ease-spring);
}
.quick-card:hover { border-color: var(--border); background: var(--bg); transform: translateY(-1px); }
.quick-card strong { display: block; font-size: 13px; font-weight: 600; }
.quick-card small { display: block; font-size: 12px; color: var(--muted); }
.quick-card .arrow { margin-left: auto; color: var(--muted); }

/* Automations + Apps split drawers */
.ops-layout { display: grid; grid-template-columns: minmax(0, 1fr); gap: 14px; align-items: start; }
.ops-layout[data-panel="open"] { grid-template-columns: minmax(0, 1fr) 336px; }
.ops-toolbar { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px; padding: 12px 16px; border-bottom: 1px solid var(--border-soft); }
.ops-row { cursor: pointer; }
.ops-row[data-selected="true"] { background: var(--sunken); }
.ops-apps { display: inline-flex; gap: 4px; align-items: center; }
.ops-apps .app-mark { width: 22px; height: 22px; border-radius: 6px; }
.ops-apps .app-mark img { width: 13px; height: 13px; }
.bars { display: inline-flex; align-items: flex-end; gap: 3px; height: 18px; }
.bars i { width: 5px; border-radius: 2px; background: var(--accent); display: block; }
.bars i.none { background: var(--border-soft); height: 2px; }
.bars i.bad { background: var(--bad); }

.switch {
  position: relative;
  display: inline-flex;
  align-items: center;
  width: 36px;
  height: 20px;
  padding: 2px;
  border-radius: 999px;
  border: 1px solid var(--border);
  background: var(--sunken);
  cursor: pointer;
  transition: background-color 180ms ease, border-color 180ms ease;
}
.switch[aria-checked="true"] { background: var(--accent); border-color: var(--accent); }
.switch i {
  width: 14px;
  height: 14px;
  border-radius: 50%;
  background: #ffffff;
  box-shadow: 0 1px 2px rgb(0 0 0 / 0.2);
  transform: translateX(0);
  transition: transform 240ms var(--ease-snappy);
}
.switch[aria-checked="true"] i { transform: translateX(16px); }

/* Apps 3-column grid */
.apps-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
.ops-layout[data-panel="open"] .apps-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.app-card {
  display: grid;
  grid-template-columns: minmax(0, 1fr) auto;
  grid-template-rows: auto auto;
  gap: 10px;
  padding: 15px;
  border: 1px solid var(--border-soft);
  border-radius: 11px;
  background: var(--surface);
  transition: border-color 140ms ease, box-shadow 140ms ease;
}
.app-card:hover { border-color: var(--border); box-shadow: var(--shadow-card); }
.app-card h3 { margin: 0; font-size: 14px; font-weight: 600; }
.app-card p { margin: 4px 0 0; font-size: 12.5px; line-height: 1.4; color: var(--muted); }

/* Team stacked rows */
.team-list { list-style: none; margin: 0; padding: 0; }
.team-row { display: grid; grid-template-columns: auto minmax(0, 1fr) auto auto auto; gap: 12px; align-items: center; padding: 11px 16px; border-bottom: 1px solid var(--border-soft); }
.team-row:last-child { border-bottom: 0; }

/* Grids & FAQ */
.grid-2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; align-items: start; }
.grid-3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
.faq-item { border: 1px solid var(--border-soft); border-radius: 10px; background: var(--bg); padding: 10px 13px; }
.faq-item summary { font-weight: 600; font-size: 13px; cursor: pointer; list-style: none; display: flex; justify-content: space-between; align-items: center; }
.faq-item summary::after { content: "+"; color: var(--muted); font-size: 15px; }
.faq-item[open] summary::after { content: "−"; }
.faq-item p { margin: 8px 0 0; font-size: 12.5px; color: var(--muted); line-height: 1.45; }
.support-grid { display: grid; grid-template-columns: minmax(0, 1.35fr) minmax(290px, 0.9fr); gap: 14px; align-items: start; }
.patch-list { display: grid; gap: 10px; }
.patch-item { padding: 11px 12px; border: 1px solid var(--border-soft); border-radius: 10px; background: var(--bg); display: grid; gap: 6px; }
.patch-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.patch-head strong { font-size: 13px; font-weight: 600; }
.patch-date { font-size: 11.5px; color: var(--muted); font-variant-numeric: tabular-nums; }
.patch-notes { margin: 0; padding-left: 16px; display: grid; gap: 4px; font-size: 12px; color: var(--muted); line-height: 1.42; }

/* Human Takeover Bar & Staff Reply Composer */
.takeover-bar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  flex-wrap: wrap;
  padding: 10px 13px;
  border-radius: 10px;
  border: 1px solid var(--border);
  background: var(--bg);
}
.takeover-bar[data-mode="staff"] {
  border-color: color-mix(in srgb, var(--warn-dot) 60%, var(--border));
  background: var(--warn-bg);
}
.takeover-bar[data-mode="bot"] {
  border-color: color-mix(in srgb, var(--ok) 35%, var(--border));
  background: var(--ok-bg);
}
.takeover-info { display: flex; align-items: center; gap: 10px; min-width: 0; flex: 1; }
.takeover-ico {
  width: 30px;
  height: 30px;
  border-radius: 8px;
  background: var(--surface);
  border: 1px solid var(--border-soft);
  display: grid;
  place-items: center;
  flex: none;
  color: var(--text);
}
.thread li[data-dir="staff"] { border-left: 3px solid var(--ok); background: color-mix(in srgb, var(--ok-bg) 55%, var(--bg)); }
.cv-reply-bar { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; padding-top: 4px; }
.cv-reply-bar .input { flex: 1; min-width: 190px; }

/* Build with AI Clarifying Question Card */
.ai-question-card {
  margin-top: 10px;
  padding: 13px 15px;
  border: 1px solid var(--border);
  border-radius: 12px;
  background: var(--surface);
  display: grid;
  gap: 10px;
}
.ai-choices { display: flex; flex-wrap: wrap; gap: 7px; }
.ai-choice-btn {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  min-height: 31px;
  padding: 4px 12px;
  border: 1px solid var(--border);
  border-radius: 9px;
  background: var(--bg);
  color: var(--text);
  font: 500 12px/1.2 var(--font-sans);
  cursor: pointer;
  transition: border-color 120ms ease, background-color 120ms ease, color 120ms ease;
}
.ai-choice-btn:hover { border-color: var(--accent); background: var(--accent-tint); color: var(--accent); }


/* Platform Admin Page */
.admin-kpi-grid { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 11px; }
.ad-tile {
  display: flex;
  flex-direction: column;
  gap: 4px;
  padding: 12px 14px;
  border: 1px solid var(--border-soft);
  border-radius: 11px;
  background: var(--surface);
  min-width: 0;
}
.ad-tile span { font-size: 11.5px; color: var(--muted); font-weight: 500; }
.ad-tile strong { font-size: 22px; font-weight: 600; letter-spacing: -0.025em; line-height: 1.1; }
.ad-tile small { font-size: 11px; color: var(--muted); }
.admin-bar-list { display: grid; gap: 7px; }
.admin-bar-row { display: grid; grid-template-columns: 38px minmax(0, 1fr) 44px; align-items: center; gap: 8px; font-size: 12px; }
.admin-bar-track { height: 8px; border-radius: 99px; background: var(--bg); border: 1px solid var(--border-soft); overflow: hidden; }
.admin-bar-fill { height: 100%; border-radius: 99px; background: var(--accent); }
.admin-audit-list { margin: 0; padding: 0; list-style: none; display: grid; gap: 7px; }
.admin-audit-list li {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  flex-wrap: wrap;
  padding: 9px 12px;
  border: 1px solid var(--border-soft);
  border-radius: 9px;
  background: var(--bg);
  font-size: 12.5px;
}

/* Mobile Hamburger Top Bar & Slide-Over Drawer */
.mobile-bar,
.mobile-backdrop,
.mobile-close-btn { display: none; }
.mobile-bar-left,
.mobile-bar-actions { display: flex; align-items: center; gap: 8px; min-width: 0; }
.mobile-bar-title {
  font-size: 14px;
  font-weight: 600;
  letter-spacing: -0.015em;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.mobile-icon-btn {
  position: relative;
  display: inline-grid;
  place-items: center;
  width: 34px;
  height: 34px;
  border: 1px solid var(--border-soft);
  border-radius: 9px;
  background: var(--bg);
  color: var(--text);
  cursor: pointer;
  flex: none;
  padding: 0;
  transition: background-color 120ms ease, border-color 120ms ease;
}
.mobile-icon-btn:hover { background: var(--surface); border-color: var(--border); }
.mobile-icon-btn svg { width: 17px; height: 17px; }
.mobile-badge {
  position: absolute;
  top: -4px;
  right: -4px;
  min-width: 16px;
  height: 16px;
  padding: 0 4px;
  border-radius: 999px;
  background: var(--accent);
  color: var(--on-accent);
  font-size: 10px;
  font-weight: 700;
  display: inline-grid;
  place-items: center;
  line-height: 1;
}
.mobile-badge[hidden] { display: none; }

.viewport[data-mode="phone"] .shell { flex-direction: column; height: 100%; overflow: hidden; }
.viewport[data-mode="phone"] .mobile-bar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  padding: 8px 12px;
  min-height: 50px;
  background: var(--surface);
  border-bottom: 1px solid var(--border-soft);
  flex: none;
  z-index: 30;
}
.viewport[data-mode="phone"] .mobile-backdrop {
  display: block;
  position: absolute;
  inset: 0;
  z-index: 48;
  background: rgb(10 11 14 / 0.42);
  opacity: 0;
  pointer-events: none;
  transition: opacity 200ms ease;
}
.viewport[data-mode="phone"][data-nav-open="true"] .mobile-backdrop { opacity: 1; pointer-events: auto; }
.viewport[data-mode="phone"] .sidebar {
  display: flex;
  position: absolute;
  top: 0;
  left: 0;
  bottom: 0;
  width: 274px;
  max-width: 84%;
  z-index: 50;
  background: var(--surface);
  border-right: 1px solid var(--border-soft);
  box-shadow: var(--shadow-overlay);
  padding: 14px 12px;
  transform: translateX(-105%);
  transition: transform 240ms var(--ease-spring);
  overflow-y: auto;
}
.viewport[data-mode="phone"][data-nav-open="true"] .sidebar { transform: translateX(0); }
.viewport[data-mode="phone"] .mobile-close-btn {
  display: grid;
  place-items: center;
  margin-left: auto;
  width: 30px;
  height: 30px;
  border-radius: 8px;
  border: 1px solid var(--border-soft);
  background: var(--bg);
  color: var(--text);
  font-size: 18px;
  line-height: 1;
  cursor: pointer;
}
.viewport[data-mode="phone"] .rail-search kbd { display: none; }
.viewport[data-mode="phone"] .shell-main {
  flex: 1;
  min-height: 0;
  padding: 0;
  overflow-y: auto;
  overflow-x: hidden;
  -webkit-overflow-scrolling: touch;
}
.viewport[data-mode="phone"] .shell-frame { border: 0; border-radius: 0; height: auto; min-height: 100%; overflow: visible; }
.viewport[data-mode="phone"] .kpi-grid,
.viewport[data-mode="phone"] .admin-kpi-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
.viewport[data-mode="phone"] .kpi-top { padding: 10px 11px 8px; }
.viewport[data-mode="phone"] .kpi-val strong { font-size: 20px; }
.viewport[data-mode="phone"] .kpi-foot { padding: 6px 11px; font-size: 11.5px; }
.viewport[data-mode="phone"] .bento-mid,
.viewport[data-mode="phone"] .bento-bot,
.viewport[data-mode="phone"] .quick-grid,
.viewport[data-mode="phone"] .split-2,
.viewport[data-mode="phone"] .apps-grid,
.viewport[data-mode="phone"] .grid-2,
.viewport[data-mode="phone"] .grid-3,
.viewport[data-mode="phone"] .ops-layout[data-panel="open"] { grid-template-columns: 1fr; }
.viewport[data-mode="phone"] .body { padding: 12px; gap: 12px; overflow: visible; }
.viewport[data-mode="phone"] .body.home-fit { display: flex; flex-direction: column; padding: 12px; gap: 12px; overflow: visible; }
.viewport[data-mode="phone"] .card { padding: 13px 14px; gap: 10px; }
.viewport[data-mode="phone"] .page-head { padding: 12px 14px; grid-template-columns: 1fr; gap: 10px; }
.viewport[data-mode="phone"] .page-head h1 { font-size: 18.5px; }
.viewport[data-mode="phone"] .head-actions { width: 100%; }
.viewport[data-mode="phone"] .chart-stage { min-height: 112px; }
.viewport[data-mode="phone"] .donut-wrap { gap: 14px; }
.viewport[data-mode="phone"] .table-wrap { overflow-x: auto !important; -webkit-overflow-scrolling: touch; }
.viewport[data-mode="phone"] th,
.viewport[data-mode="phone"] td { padding: 7px 9px; font-size: 12px; white-space: nowrap; }
.viewport[data-mode="phone"] #home-search,
.viewport[data-mode="phone"] #ops-search,
.viewport[data-mode="phone"] #apps-search { width: 100% !important; min-width: 0 !important; flex: 1; }
.viewport[data-mode="phone"] .card-head > div[style*="margin-left:auto"] { width: 100%; margin-left: 0 !important; }
.viewport[data-mode="phone"] .card-head .p-seg,
.viewport[data-mode="phone"] .ops-toolbar .p-seg { margin-left: 0 !important; max-width: 100%; overflow-x: auto; }
.viewport[data-mode="phone"] .ops-toolbar { padding: 10px 12px; gap: 8px; }
.viewport[data-mode="phone"] .team-row { grid-template-columns: auto minmax(0, 1fr) auto; padding: 10px 12px; gap: 8px; }
.viewport[data-mode="phone"] .team-row small { display: none; }
.viewport[data-mode="phone"] .team-invite-row > * { width: 100% !important; min-width: 0 !important; flex: 1 1 100% !important; }

/* Dialog & Toast */
dialog.cmd {
  width: min(460px, calc(100vw - 32px));
  padding: 0;
  border: 1px solid var(--border-soft);
  border-radius: 12px;
  background: var(--surface);
  color: var(--text);
  box-shadow: var(--shadow-overlay);
}
dialog.cmd::backdrop { background: rgb(10 11 14 / 0.35); }
.cmd-in { width: 100%; border: 0; border-bottom: 1px solid var(--border-soft); padding: 13px 16px; background: transparent; color: var(--text); font: 400 13.5px var(--font-sans); outline: none; }
.cmd-list { padding: 8px; display: grid; gap: 2px; max-height: 300px; overflow-y: auto; }

/* Interactive Workflow Editor */
.ed-shell { flex: 1; min-height: 0; display: flex; flex-direction: column; background: var(--surface); overflow: hidden; }
.ed-head {
  flex: none;
  display: flex;

.ed-crumb button { border: 0; padding: 0; background: transparent; color: var(--muted); font: inherit; cursor: pointer; }
.ed-crumb button:hover { color: var(--text); text-decoration: underline; }
.ed-title-row { display: flex; align-items: center; gap: 9px; flex-wrap: wrap; }

  grid-template-columns: minmax(0, 1fr) 340px;
  overflow: hidden;
}

.ed-canvas {
  position: relative;
  display: flex;
  flex-direction: column;
  gap: 10px;
  min-height: 0;

.ed-live-bar {

  border: 1px solid var(--ok);

.ed-tools { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px; flex: none; }

  justify-content: center;
  align-items: flex-start;

.ed-dag-stage {
  position: relative;

  transform-origin: top center;
  transition: transform 160ms var(--ease-spring);
}
.ed-dag-svg {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  overflow: visible;
  pointer-events: none;
}
.ed-edge-path {
  fill: none;

}
.ed-edge-path.done { stroke: var(--ok); }
.ed-edge-path.flowing { stroke: var(--accent); stroke-dasharray: 6 4; }
.ed-run-dot { fill: var(--accent); }
.ed-node-abs {
  position: absolute;

  z-index: 2;
}
.ed-node {

}
.ed-handle {
  position: absolute;
  left: 50%;
  width: 8px;
  height: 8px;

  background: var(--accent);

.ed-node-kicker {

function needsClarification(promptText, priorMessages) {
  const lower = promptText.trim().toLowerCase();
  if (!lower || lower === "build it now with what you have.") return null;
  const lastAssistant = [...priorMessages].reverse().find(m => m.role === "assistant");
  if (lastAssistant?.kind === "question") return null;
  if ([...priorMessages].some(m => m.draft)) return null;
  const words = lower.split(/\s+/).filter(Boolean);
  const hasTrigger = /\b(when|every|on|whenever|if|after|morning|monday|daily|shopify|form|messenger|email|order|receipt|gcash)\b/.test(lower);
  const hasAction = /\b(send|email|reply|post|log|save|create|book|quote|notify|approve|confirm|archive)\b/.test(lower);
  if (words.length <= 4 || !(hasTrigger && hasAction)) {
    if (lower.includes("reminder") || lower.includes("book")) {
      return {
        text: "Got it. Before I draft the steps, when should this run and how should guests be notified?",
        choices: [
          "Every morning at 8 AM for tomorrow's check-ins via Gmail",
          "Right after a guest submits our booking form",
          "Notify staff on Slack + send WhatsApp reminder"
        ]
      };
    }
    return {
      text: `I want to make sure "${promptText.trim()}" starts and finishes the right way. What starts this automation?`,
      choices: [
        "When a guest sends a GCash receipt on Messenger",
        "Every morning at 8 AM from Google Calendar",
        "When a guest submits our booking inquiry form"
      ]
    };
  }
  return null;
}

function buildAiDraft(promptText, opts = {}) {
  const lower = promptText.toLowerCase();
  const prevDraft = [...state.aiMessages].reverse().find(m => m.draft)?.draft || null;

  // Multi-turn follow-up refinement when an active draft already exists
  if (prevDraft && state.aiMessages.length > 0 && lower.length < 130 && /also|add|post|save|send|notify|include|change/.test(lower)) {
    const updated = JSON.parse(JSON.stringify(prevDraft));
    if (lower.includes("slack")) {
      if (!updated.apps.includes("slack")) updated.apps.push("slack");
      updated.steps.push("Post confirmation alert to #front-desk on Slack");
    } else if (lower.includes("drive")) {
      if (!updated.apps.includes("google-drive")) updated.apps.push("google-drive");
      updated.steps.push("Save receipt file copy to Google Drive shared folder");
    } else if (lower.includes("whatsapp")) {
      if (!updated.apps.includes("whatsapp")) updated.apps.push("whatsapp");
      updated.steps.push("Send WhatsApp confirmation message to guest");
    } else if (lower.includes("sheet")) {
      if (!updated.apps.includes("google-sheets")) updated.apps.push("google-sheets");
      updated.steps.push("Append confirmed row to Google Sheets");
    } else {
      updated.steps.push(`Run follow-up action: ${promptText.trim().slice(0, 72)}`);
    }
    return {
      summary: `Updated "${updated.name}" with your follow-up step (${updated.steps.length} steps total).`,
      reasoning: opts.reason ? `Merged new instruction into existing "${updated.name}" graph while keeping prior steps intact.` : "",
      draft: updated
    };
  }

  let draft;
  if (lower.includes("gcash") || lower.includes("receipt") || lower.includes("deposit")) {
    draft = {
      name: "GCash deposit verifier",
      trigger: "Messenger message",
      triggerType: "meta_dm",
      apps: ["messenger", "google-sheets", "gmail"],
      steps: [
        "Extract PHP amount & 6-13 digit reference from uploaded receipt image",
        "Hold in Inbox for staff confirmation against GCash history",
        "Log confirmed deposit to Bookings & Receipts 2026 sheet",
        "Email guest confirmation pass via Gmail"
      ]
    };
  } else if (lower.includes("reminder") || lower.includes("8 am") || lower.includes("calendar")) {
    draft = {
      name: "Morning guest arrival pass",
      trigger: "Daily 8:00 AM schedule",
      triggerType: "schedule",
      apps: ["google-calendar", "gmail"],
      steps: [
        "Fetch tomorrow's stays from Google Calendar",
        "Pull directions & check-in time from Knowledge v4",
        "Send arrival directions & gate code via Gmail"
      ]
    };
  } else if (lower.includes("inquir") || lower.includes("knowledge") || lower.includes("rate")) {
    draft = {
      name: "Resort inquiry responder",
      trigger: "Messenger DM",
      triggerType: "meta_dm",
      apps: ["messenger", "gmail"],
      steps: [
        "Search Knowledge v4 for room rates, check-in hours, and parking",
        "Send instant reply inside 24h Messenger window",
        "Route special early check-in requests to Inbox for staff takeover"
      ]
    };
  } else if (lower.includes("approval") || lower.includes("purchase")) {
    draft = {
      name: "Purchase approval router",
      trigger: "Staff request form",
      triggerType: "form",
      apps: ["slack", "gmail"],
      steps: [
        "Assign REQ-2026 reference ID to submitted purchase request",
        "Pause in Inbox for Owner approval decision",
        "Post approved request summary to #front-desk on Slack"
      ]
    };
  } else if (lower.includes("lalamove") || lower.includes("shopify") || lower.includes("delivery")) {
    draft = {
      name: "Shopify to Lalamove dispatch",
      trigger: "New Shopify order",
      triggerType: "shopify_order",
      apps: ["shopify", "lalamove", "gmail"],
      steps: [
        "Request motorcycle delivery quote from Lalamove Partner API",
        "Book rider once quote matches delivery zone",
        "Email tracking link to customer via Gmail"
      ]
    };
  } else {
    const pickedApps = state.aiSelectedApps.length ? [...state.aiSelectedApps] : ["messenger", "google-sheets", "gmail"];
    draft = {
      name: "Custom booking workflow",
      trigger: "Booking form submit",
      triggerType: "form",
      apps: pickedApps,
      steps: [
        "Capture guest booking submission and assign REQ reference",
        "Validate details with AI and check Knowledge rules",
        "Route confirmation to Inbox before syncing connected apps"
      ]
    };
  }

  if (lower.includes("slack") && !draft.apps.includes("slack")) {
    draft.apps.push("slack");
    draft.steps.push("Post status note to Slack #front-desk");
  }
  return {
    summary: `I put together a ${draft.steps.length}-step "${draft.name}" draft triggered by ${draft.trigger.toLowerCase()}.`,
    reasoning: opts.reason ? `Selected ${draft.apps.join(", ")} based on your active Workspace connections and included a human safety check where payments or guest promises occur.` : "",
    draft
  };
}

function toast(msg, tone = "ok", undoFn = null) {
  const host = document.getElementById("toast-host");
  const el = document.createElement("div");
  el.className = `toast motion-toast ${tone}`;
  el.innerHTML = `<span>${msg}</span>${undoFn ? `<button type="button" class="btn sm">Undo</button>` : ""}`;
  if (undoFn) el.querySelector("button").onclick = () => { undoFn(); el.remove(); };
  host.appendChild(el);
  setTimeout(() => el.remove(), 4000);
}

function animateCounters() {
  const reduced = document.documentElement.dataset.motion === "reduced" || matchMedia("(prefers-reduced-motion: reduce)").matches;
  document.querySelectorAll("[data-count]").forEach(el => {
    const raw = el.dataset.count;
    const target = parseFloat(raw);
    const suffix = raw.replace(/[0-9.]/g, "");
    const dec = raw.includes(".") ? 1 : 0;
    if (reduced || Number.isNaN(target)) { el.textContent = raw; return; }
    const start = performance.now();
    function step(now) {
      const p = Math.min(1, (now - start) / 420);
      const eased = 1 - Math.pow(1 - p, 3);
      el.textContent = (target * eased).toFixed(dec) + suffix;
      if (p < 1) requestAnimationFrame(step);
      else el.textContent = raw;
    }
    requestAnimationFrame(step);
  });
}

function bindSlidingPill(containerSelector, itemSelector, pillSelector) {
  const container = document.querySelector(containerSelector);
  const pill = document.querySelector(pillSelector);
  if (!container || !pill) return;
  container.querySelectorAll(itemSelector).forEach(item => {
    item.addEventListener("pointerenter", () => {
      const r = item.getBoundingClientRect();
      const c = container.getBoundingClientRect();
      pill.style.opacity = "1";
      pill.style.width = `${r.width}px`;
      pill.style.height = `${r.height}px`;
      pill.style.transform = `translate3d(${r.left - c.left}px, ${r.top - c.top}px, 0)`;
    });
  });
  container.addEventListener("pointerleave", () => { pill.style.opacity = "0"; });
}

function syncSidebar() {
  const activeGroup = state.view === "bookings"

      : state.view === "business"
        ? "business"
        : null;

  document.querySelectorAll(".rail-group").forEach(grp => {
    const k = grp.dataset.group;
    grp.setAttribute("data-open", String(Boolean(state.openGroups[k])));
    grp.setAttribute("data-has-active", String(activeGroup === k));
    const btn = grp.querySelector(".rail-parent");
    if (btn) btn.setAttribute("aria-expanded", String(Boolean(state.openGroups[k])));
  });

  const leafView = state.view === "editor" ? "automations" : state.view;
  document.querySelectorAll(".rail-link[data-nav]").forEach(a => {
    a.setAttribute("aria-current", a.dataset.nav === leafView ? "page" : "false");

  document.querySelectorAll(".rail-sublink").forEach(a => {
    const matchView = a.dataset.nav === leafView;
    const matchSub = !a.dataset.sub || a.dataset.sub === state.subTab[state.view];
    a.setAttribute("aria-current", matchView && matchSub ? "page" : "false");
  });
}

function chartPoints() {
  const w = 560, h = 118, px = 16, py = 12, maxY = 72;
  return trend.map((d, i) => ({
    x: +(px + ((w - px * 2) / 6) * i).toFixed(1),
    y: +(py + (h - py * 2) * (1 - d.total / maxY)).toFixed(1)
  }));
}

function chartSvgMarkup() {
  const w = 560, h = 118, py = 12;
  const pts = chartPoints();
  let line = `M ${pts[0].x} ${pts[0].y}`;
  for (let i = 1; i < pts.length; i++) {
    const cx = +((pts[i - 1].x + pts[i].x) / 2).toFixed(1);
    line += ` C ${cx} ${pts[i - 1].y}, ${cx} ${pts[i].y}, ${pts[i].x} ${pts[i].y}`;
  }
  const area = `${line} L ${pts[6].x} ${h - py} L ${pts[0].x} ${h - py} Z`;
  const p = pts[state.activeDay];
  const d = trend[state.activeDay];
  const rate = d.total ? ((d.ok / d.total) * 100).toFixed(1) : "100.0";
  const tipLeft = Math.min(84, Math.max(16, +((p.x / w) * 100).toFixed(1)));
  return `
    <div class="chart-box" id="what-ran-box">
      <div class="chart-stage" id="what-ran-stage">
        <svg class="area-svg" id="what-ran-svg" viewBox="0 0 560 118" preserveAspectRatio="none" aria-label="Last 7 days activity">
          <defs><linearGradient id="g-area" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="var(--accent)" stop-opacity="0.20"/><stop offset="100%" stop-color="var(--accent)" stop-opacity="0.01"/></linearGradient></defs>
          <line x1="16" x2="544" y1="12" y2="12" class="gridline"/>
          <line x1="16" x2="544" y1="43" y2="43" class="gridline"/>
          <line x1="16" x2="544" y1="74" y2="74" class="gridline"/>
          <path d="${area}" fill="url(#g-area)"/>
          <path d="${line}" class="area-line"/>
          <line id="chart-stem" x1="${p.x}" x2="${p.x}" y1="${p.y}" y2="${h - py}" class="focus-stem"/>
          <circle id="chart-halo" cx="${p.x}" cy="${p.y}" r="9" class="focus-halo"/>
          <circle id="chart-dot" cx="${p.x}" cy="${p.y}" r="4.5" class="focus-dot"/>
          ${pts.map((pt, i) => {
            const left = i === 0 ? 0 : (pts[i - 1].x + pt.x) / 2;
            const right = i === pts.length - 1 ? w : (pt.x + pts[i + 1].x) / 2;
            return `<rect class="chart-hit" data-chart-day="${i}" x="${left.toFixed(1)}" y="0" width="${(right - left).toFixed(1)}" height="${h}"/>`;
          }).join("")}
        </svg>
        <div class="chart-tip" id="chart-tip" data-open="false" style="left:${tipLeft}%">
          <div class="chart-tip-head"><strong>${d.day}</strong><span class="tnum" style="font-weight:600">${d.total} runs</span></div>
          <div class="chart-tip-sub"><span class="tnum">${d.ok} ok · ${d.failed} failed</span><span class="tnum" style="margin-left:auto;color:var(--ok)">${rate}%</span></div>
        </div>
      </div>
      <div class="day-row">${trend.map((day, i) => `<button type="button" class="day-btn" data-day="${i}" aria-pressed="${i === state.activeDay}">${day.label}</button>`).join("")}</div>
    </div>
  `;
}

function layoutEditorDag(wf) {
  const NODE_W = 256, NODE_H = 98, COL = 290, ROW_GAP = 72;
  const steps = wf.editorSteps || [];
  const edges = (wf.edges && wf.edges.length)
    ? wf.edges
    : steps.map((s, idx) => ({ from: idx === 0 ? "trigger" : steps[idx - 1].id, to: s.id }));

  const depth = { trigger: 0 };
  const childrenMap = { trigger: [] };
  steps.forEach(s => { childrenMap[s.id] = []; });
  edges.forEach(e => {
    if (childrenMap[e.from]) childrenMap[e.from].push(e);
  });

  const visit = (id, d) => {
    depth[id] = Math.max(depth[id] || 0, d);
    (childrenMap[id] || []).forEach(e => visit(e.to, d + 1));
  };
  visit("trigger", 0);

  const widthMemo = {};
  const subWidth = (id) => {
    if (widthMemo[id]) return widthMemo[id];
    const kids = childrenMap[id] || [];
    const w = kids.length ? kids.reduce((sum, e) => sum + subWidth(e.to), 0) : 1;
    widthMemo[id] = w;
    return w;
  };
  const totalSlots = subWidth("trigger");
  const pos = {};
  const place = (id, leftSlot) => {
    const kids = childrenMap[id] || [];
    const y = 16 + (depth[id] || 0) * (NODE_H + ROW_GAP);
    if (!kids.length) {
      const cx = (leftSlot + 0.5) * COL;
      pos[id] = { cx, x: Math.round(cx - NODE_W / 2), y };
      return cx;
    }
    let cur = leftSlot;
    const centers = [];
    kids.forEach(e => {
      centers.push(place(e.to, cur));
      cur += subWidth(e.to);
    });
    const cx = (centers[0] + centers[centers.length - 1]) / 2;
    pos[id] = { cx, x: Math.round(cx - NODE_W / 2), y };
    return cx;
  };
  place("trigger", 0);

  const stageW = Math.max(320, totalSlots * COL + 24);
  const maxDepth = Math.max(0, ...Object.values(depth));
  const stageH = 28 + (maxDepth + 1) * NODE_H + maxDepth * ROW_GAP + 46;
  const leafIds = new Set(["trigger", ...steps.map(s => s.id)].filter(id => !(childrenMap[id] || []).length));
  return { pos, edges, stageW, stageH, NODE_W, NODE_H, leafIds };
}

      ` : ""}
    </div>
  `;
}

function aiPanel(scope, cfg) {
  const p = PROVIDERS[cfg.provider];

        <label class="field-block"><span class="ai-label">Model</span>
          <input class="input mono" data-ai-field="model" list="ai-models-${scope}" value="${escapeHtml(cfg.model)}" placeholder="${p.models[0] || "provider/model-name"}" autocomplete="off">
          <datalist id="ai-models-${scope}">${p.models.map(m => `<option value="${m}">`).join("")}</datalist>

  `;
}

const LIVE_EVENTS = [
  { kind: "chats", title: "New WhatsApp chat", detail: "Jomar Reyes: Pwede po ba early check-in sa Saturday?", go: "inbox" },
  { kind: "runs", title: "Live run succeeded", detail: "GCash receipt check · PHP 3,500 matched · 1.6s", go: "automations" },
  { kind: "inbox", title: "Guest asked for a person", detail: "Carla Mendoza on Messenger · bot paused, waiting for staff", go: "inbox" },
  { kind: "chats", title: "New Messenger chat", detail: "Paolo Lim: Magkano po Garden Casita for 2 nights?", go: "inbox" },
  { kind: "failed", title: "Run failed", detail: "Receipt archive · Google Drive needs reconnecting", go: "automations" },
  { kind: "runs", title: "Live run succeeded", detail: "Booking confirmation · Dec 20 to 22 · 2.0s", go: "automations" }
];
let liveIdx = 0;

function pushLiveEvent() {
  if (state.role === "admin" || state.role === "approver" || document.hidden) return;
  for (let tries = 0; tries < LIVE_EVENTS.length; tries++) {
    const ev = LIVE_EVENTS[liveIdx++ % LIVE_EVENTS.length];
    if (!state.settingsNotifs[ev.kind]) continue;
    state.notifs.unshift({ ...ev, id: `n-${Date.now()}`, when: "Just now", unread: true });
    state.notifs = state.notifs.slice(0, 20);
    syncNotifs();
    toast(`<strong>${escapeHtml(ev.title)}</strong> · ${escapeHtml(ev.detail)}`, ev.kind === "failed" || ev.kind === "inbox" ? "warn" : "ok");
    return;
  }
}

function syncNotifs() {
  const unread = state.notifs.filter(n => n.unread).length;
  document.querySelectorAll(".notif-dot").forEach(d => { d.textContent = String(unread); d.hidden = unread === 0; });
  document.querySelectorAll(".notif-btn").forEach(b => {
    b.setAttribute("aria-expanded", String(state.notifOpen));
    b.setAttribute("aria-label", unread ? `Notifications, ${unread} unread` : "Notifications");
  });
  const panel = document.getElementById("notif-panel");
  if (!panel) return;
  panel.hidden = !state.notifOpen;
  if (!state.notifOpen) return;
  panel.innerHTML = `
    <div class="notif-head"><span>Notifications</span><button type="button" class="btn sm" id="notif-read-all">Mark all read</button></div>
    ${state.notifs.map(n => `<button type="button" class="notif-item" data-notif="${n.id}" data-unread="${n.unread}"><i></i><strong>${escapeHtml(n.title)}</strong><small>${n.when}</small><span>${escapeHtml(n.detail)}</span></button>`).join("") || `<p style="padding:14px;margin:0;color:var(--muted);font-size:12.5px">Nothing new.</p>`}
    <p class="notif-foot">Live while the console is open. Change what shows here in Settings.</p>
  `;
  document.getElementById("notif-read-all").onclick = e => { e.stopPropagation(); state.notifs.forEach(n => { n.unread = false; }); syncNotifs(); };
  panel.querySelectorAll("[data-notif]").forEach(b => b.onclick = e => {
    e.stopPropagation();
    const n = state.notifs.find(x => x.id === b.dataset.notif);
    if (!n) return;
    n.unread = false;
    state.notifOpen = false;
    navigate(n.go);
  });
}

function setRole(role) {
  state.role = role;
  document.querySelectorAll("[data-role-btn]").forEach(x => x.setAttribute("aria-pressed", String(x.dataset.roleBtn === role)));
  if (role === "operator" && OWNER_ONLY_VIEWS.includes(state.view)) state.view = "home";
  state.notifOpen = false;
  setMobileNav(false);
  syncSidebar();
  render();
}

function wireShellEvents() {
  document.querySelectorAll("[data-role-btn]").forEach(b => b.onclick = () => setRole(b.dataset.roleBtn));
  document.querySelectorAll(".notif-btn").forEach(b => b.onclick = e => {
    e.stopPropagation();
    state.notifOpen = !state.notifOpen;
    syncNotifs();
  });
  document.addEventListener("click", e => {
    if (state.notifOpen && !e.target.closest("#notif-panel")) { state.notifOpen = false; syncNotifs(); }
  });
  document.addEventListener("keydown", e => {
    if (e.key === "Escape" && state.notifOpen) { state.notifOpen = false; syncNotifs(); }
  });
  setTimeout(pushLiveEvent, 8000);
  setInterval(pushLiveEvent, 30000);
}

function wireRoleEvents() {
  document.querySelectorAll("[data-admin-tab]").forEach(b => b.onclick = () => { state.adminTab = b.dataset.adminTab; render(); });
  document.querySelectorAll("[data-fb-filter]").forEach(b => b.onclick = () => { state.adminFbFilter = b.dataset.fbFilter; render(); });
  document.querySelectorAll("[data-fb-open]").forEach(b => b.onclick = () => {
    state.adminFbOpen = state.adminFbOpen === b.dataset.fbOpen ? null : b.dataset.fbOpen;
    render();
  });
  const fbSet = (id, status, reply) => {
    const fb = state.adminFeedback.find(x => x.id === id);
    if (!fb) return;
    fb.status = status;
    if (reply) fb.reply = reply;
    const tk = state.supportTickets.find(t => t.id === id);
    if (tk) tk.status = status === "Replied" ? "Answered" : status;
  };
  document.querySelectorAll("[data-fb-reply]").forEach(b => b.onclick = () => {
    const text = document.getElementById("fb-reply-in")?.value.trim();
    if (!text) return toast("Write a reply first.", "warn");
    fbSet(b.dataset.fbReply, "Replied", text);
    toast("Reply sent. It shows on their Support page.", "ok");
    render();
  });
  document.querySelectorAll("[data-fb-close]").forEach(b => b.onclick = () => { fbSet(b.dataset.fbClose, "Closed"); state.adminFbOpen = null; render(); });
  document.querySelectorAll("[data-admin-save-think]").forEach(b => b.onclick = () => {
    const ws = state.adminWorkspaces.find(w => w.id === b.dataset.adminSaveThink);
    const next = document.querySelector(`[data-admin-think="${ws.id}"]`).value || null;
    if (next === ws.aiThinking) return;
    state.adminActions.unshift({ id: `ad-${Date.now()}`, adminEmail: "ops@kymavo.ph", action: "thinking", target: ws.org, before: ws.aiThinking || "default", after: next || "default", when: "Just now" });
    ws.aiThinking = next;
    toast(`Thinking for ${ws.org} saved.`, "ok");
    render();
  });
  document.querySelectorAll("[data-ai-scope]").forEach(form => {
    const admin = form.dataset.aiScope === "admin";
    const cfg = admin ? state.adminAi : state.wsAi;
    const readModel = () => { const m = form.querySelector('[data-ai-field="model"]'); if (m) cfg.model = m.value.trim(); };
    form.querySelector('[data-ai-field="provider"]').onchange = e => {
      cfg.provider = e.target.value;
      cfg.model = PROVIDERS[cfg.provider].models[0] || "";
      cfg.keyTail = "";
      cfg.replacingKey = false;
      cfg.testMsg = "";
      render();
    };
    form.querySelectorAll("[data-ai-thinking]").forEach(b => b.onclick = () => { readModel(); cfg.thinking = b.dataset.aiThinking; render(); });
    const rep = form.querySelector("[data-ai-replace]");
    if (rep) rep.onclick = () => { readModel(); cfg.replacingKey = true; render(); };
    form.querySelector("[data-ai-test]").onclick = () => {
      readModel();
      if (!cfg.model) return toast("Enter a model name first.", "warn");
      cfg.testMsg = `${cfg.model} answered in 1.3s.`;
      render();
    };
    form.querySelector("[data-ai-save]").onclick = () => {
      readModel();
      const key = form.querySelector('[data-ai-field="key"]')?.value.trim();
      if (!cfg.model) return toast("Enter a model name first.", "warn");
      if (cfg.provider !== "local" && !cfg.keyTail && !key) return toast("Paste an API key first.", "warn");
      if (key) { cfg.keyTail = key.slice(-4); cfg.replacingKey = false; }
      if (admin) state.adminActions.unshift({ id: `ad-${Date.now()}`, adminEmail: "ops@kymavo.ph", action: "ai", target: "Shared model", before: "", after: `${PROVIDERS[cfg.provider].label} · ${cfg.model} · thinking ${cfg.thinking}`, when: "Just now" });
      toast("AI model saved. The next AI step uses it.", "ok");
      render();
    };
  });
  const wsOwn = document.getElementById("ws-ai-own");
  if (wsOwn) wsOwn.onclick = () => { state.wsAi.own = !state.wsAi.own; render(); };
  const saveName = document.getElementById("set-save-name");
  if (saveName) saveName.onclick = () => {
    const v = document.getElementById("set-name")?.value.trim();
    if (!v) return toast("Enter your name.", "warn");
    currentUser().name = v;
    toast("Name saved.", "ok");
    render();
  };
  document.querySelectorAll("[data-req-decide]").forEach(b => b.onclick = () => {
    const r = state.approverQueue.find(x => x.id === b.dataset.reqDecide);
    if (!r) return;
    r.decision = b.dataset.decision;
    toast(`${r.decision}: ${r.title}. The automation continues.`, "ok");
    render();
  });
  document.querySelectorAll("[data-req-signout]").forEach(b => b.onclick = () => toast("Preview only: sign-out is disabled.", "ok"));
}

function submitAiPrompt(rawText) {
  const text = (rawText ?? state.aiInput).trim();
  if (!text || state.aiThinking) return;
  const prior = [...state.aiMessages];
  state.aiMessages.push({ role: "user", text });
  state.aiInput = "";
  state.aiThinking = true;
  state.aiHistoryOpen = false;
  render();
  setTimeout(() => {
    const clarify = needsClarification(text, prior);
    state.aiThinking = false;
    if (clarify) {
      state.aiMessages.push({ role: "assistant", kind: "question", text: clarify.text, choices: clarify.choices });
    } else {
      const combined = text === "Build it now with what you have."
        ? (prior.filter(m => m.role === "user").map(m => m.text).join(" ") || text)
        : prior.some(m => m.kind === "question")
          ? `${prior.filter(m => m.role === "user").map(m => m.text).join(" ")} ${text}`
          : text;
      const res = buildAiDraft(combined);
      state.aiMessages.push({ role: "assistant", text: res.summary, draft: res.draft });
    }
    render();
    document.getElementById("ai-input")?.focus();
  }, 220);
}

function saveAiDraftWorkflow(draft, makeLive = false) {
  const id = state.workflows.reduce((m, w) => Math.max(m, w.id), 0) + 1;
  const wf = {
    id,
    name: draft.name,
    sub: makeLive ? "Running smoothly" : "Draft, created with AI",
    status: makeLive ? "on" : "draft",
    badge: makeLive ? "Live" : "Draft",
    cls: makeLive ? "ok" : "neutral",
    live: makeLive,
    paused: false,
    apps: draft.apps,
    trigger: draft.trigger,
    bars: [0, 0, 0, 0, 0, 0, 0],
    last: makeLive ? "Just now" : "Never",
    version: 1,
    triggerType: draft.triggerType || "form",
    triggerLabel: draft.trigger,
    triggerLogo: draft.apps[0] || "messenger",
    triggerConfig: { source: draft.trigger },
    versions: [{ v: 1, date: "Just now", live: makeLive, by: "maria@resort.ph" }],
    steps: draft.steps,
    edges: draft.steps.map((_, idx) => ({ from: idx === 0 ? "trigger" : `s${idx}`, to: `s${idx + 1}` })),
    editorSteps: draft.steps.map((st, idx) => ({
      id: `s${idx + 1}`,
      type: "ai_extract",
      app: idx === 0 ? "kymavo AI" : (draft.apps[idx % draft.apps.length] || "kymavo"),
      logo: draft.apps[idx % draft.apps.length] || "gmail",
      title: st,
      summary: "Generated by Build with AI",
      config: { note: st }
    }))
  };
  state.workflows.unshift(wf);
  return wf;
}

function pushEditorHistory(wf, note = "") {
  state.editorPast.push(JSON.stringify({ editorSteps: wf.editorSteps, edges: wf.edges || [] }));
  state.editorFuture = [];
  state.editorDirty = true;
  state.editorNote = note;
}

function saveEditorAiChat(wf, showToast = true) {
  if (!wf || !wf.aiChat || !wf.aiChat.length) return;
  const chatId = wf.aiChatSavedId || `ed-chat-${wf.id}`;
  wf.aiChatSavedId = chatId;
  wf.aiChatSaved = true;
  const msgs = wf.aiChat.map((m, idx) => {
    const out = { role: m.role, text: m.text };
    if (m.role === "assistant" && idx === wf.aiChat.length - 1) {
      out.draft = {
        name: wf.name,
        trigger: wf.triggerLabel || wf.trigger,
        triggerType: wf.triggerType || "form",
        apps: wf.apps || ["gmail"],
        steps: wf.editorSteps.map(s => s.title)
      };
    }
    return out;
  });
  const entry = {
    id: chatId,
    wfId: wf.id,
    title: `${wf.name} · Editor`,
    when: `Workflow editor · ${wf.aiChat.length} msgs`,
    messages: msgs
  };
  const existingIdx = state.aiSavedChats.findIndex(c => c.id === chatId);
  if (existingIdx >= 0) state.aiSavedChats[existingIdx] = entry;
  else state.aiSavedChats.unshift(entry);
  if (showToast) toast(`Saved "${entry.title}" to AI History.`, "ok");
}

function wireFrameEvents() {
  document.querySelectorAll("[data-go]").forEach(el => {
    el.onclick = e => {
      e.preventDefault();
      if (el.dataset.openApp) state.openAppKey = el.dataset.openApp;
      navigate(el.dataset.go, el.dataset.tab);
    };
  });
  document.querySelectorAll("[data-ed-open]").forEach(el => {
    el.onclick = () => {
      state.editorWfId = Number(el.dataset.edOpen);
      state.editorTab = "steps";
      state.editorSelected = null;
      state.editorTestRun = null;
      navigate("editor");
    };
  });
  document.querySelectorAll("[data-copy]").forEach(el => {
    el.onclick = () => {
      const val = el.dataset.copy;
      try { navigator.clipboard?.writeText(val); } catch {}
      toast(`Copied ${val.length > 32 ? `${val.slice(0, 32)}…` : val}`, "ok");
    };
  });
  function updateWhatRanGraph(dayIdx, showTip) {
    const idx = Math.max(0, Math.min(trend.length - 1, Number(dayIdx)));
    state.activeDay = idx;
    const pts = chartPoints();
    const p = pts[idx];
    const d = trend[idx];
    const stem = document.getElementById("chart-stem");
    const halo = document.getElementById("chart-halo");
    const dot = document.getElementById("chart-dot");
    if (stem) { stem.setAttribute("x1", p.x); stem.setAttribute("x2", p.x); stem.setAttribute("y1", p.y); }
    if (halo) { halo.setAttribute("cx", p.x); halo.setAttribute("cy", p.y); }
    if (dot) { dot.setAttribute("cx", p.x); dot.setAttribute("cy", p.y); }
    const inlineTip = document.getElementById("trend-inline-tip");
    if (inlineTip) inlineTip.innerHTML = `<strong>${d.day}</strong><span class="tnum" style="color:var(--muted)">${d.total} runs</span>`;
    document.querySelectorAll(".day-btn[data-day]").forEach(b => b.setAttribute("aria-pressed", String(Number(b.dataset.day) === idx)));
    const tip = document.getElementById("chart-tip");
    if (tip) {
      const rate = d.total ? ((d.ok / d.total) * 100).toFixed(1) : "100.0";
      const leftPct = Math.min(84, Math.max(16, +((p.x / 560) * 100).toFixed(1)));
      tip.style.left = `${leftPct}%`;
      tip.innerHTML = `<div class="chart-tip-head"><strong>${d.day}</strong><span class="tnum" style="font-weight:600">${d.total} runs</span></div><div class="chart-tip-sub"><span class="tnum">${d.ok} ok · ${d.failed} failed</span><span class="tnum" style="margin-left:auto;color:var(--ok)">${rate}%</span></div>`;
      if (typeof showTip === "boolean") tip.dataset.open = String(showTip);
    }
  }
  const whatRanBox = document.getElementById("what-ran-box");
  const whatRanSvg = document.getElementById("what-ran-svg");
  if (whatRanSvg) {
    const pickDayFromEvent = e => {
      const rect = whatRanSvg.getBoundingClientRect();
      if (!rect.width) return state.activeDay;
      const svgX = ((e.clientX - rect.left) / rect.width) * 560;
      const pts = chartPoints();
      let best = 0, bestDist = Infinity;
      pts.forEach((pt, i) => {
        const dist = Math.abs(svgX - pt.x);
        if (dist < bestDist) { bestDist = dist; best = i; }
      });
      return best;
    };
    whatRanSvg.onpointerenter = e => updateWhatRanGraph(pickDayFromEvent(e), true);
    whatRanSvg.onpointermove = e => updateWhatRanGraph(pickDayFromEvent(e), true);
  }
  if (whatRanBox) {
    whatRanBox.onpointerleave = () => {
      const tip = document.getElementById("chart-tip");
      if (tip) tip.dataset.open = "false";
    };
  }
  document.querySelectorAll("[data-day]").forEach(btn => {
    btn.onpointerenter = () => updateWhatRanGraph(btn.dataset.day, true);
    btn.onfocus = () => updateWhatRanGraph(btn.dataset.day, true);
    btn.onblur = () => { const tip = document.getElementById("chart-tip"); if (tip) tip.dataset.open = "false"; };
    btn.onclick = () => updateWhatRanGraph(btn.dataset.day, true);
  });
  const homeSearch = document.getElementById("home-search");
  if (homeSearch) homeSearch.oninput = e => { state.homeQuery = e.target.value; render(); document.getElementById("home-search").focus(); };
  const askToggle = document.getElementById("ask-toggle");

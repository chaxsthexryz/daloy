  document.querySelectorAll("[data-sup-topic]").forEach(b => b.onclick = () => { state.supportTopic = b.dataset.supTopic; render(); });
  const supSend = document.getElementById("sup-send-btn");
  if (supSend) supSend.onclick = () => {
    const msg = document.getElementById("sup-msg")?.value.trim() || "Workspace feedback";
    const snippet = msg.length > 44 ? `${msg.slice(0, 44)}…` : msg;
    state.supportTickets.unshift({ id: `FBK-${105 + state.supportTickets.length}`, topic: state.supportTopic, subject: snippet, status: "Sent", time: "Just now" });
    state.adminFeedback.unshift({ id: state.supportTickets[0].id, org: "Villa Solis Resort", email: currentUser().email, topic: state.supportTopic, message: msg, status: "New", time: "Just now" });
    toast("Feedback sent to your kymavo operator.", "ok");
    render();
  };

  document.querySelectorAll('input[name="p-theme"]').forEach(r => r.onchange = () => setTheme(r.value));
  document.querySelectorAll("[data-set-theme]").forEach(b => b.onclick = () => setTheme(b.dataset.setTheme));
  document.querySelectorAll("[data-set-lang]").forEach(b => b.onclick = () => {
    state.language = b.dataset.setLang;
    toast(`Workspace language set to ${state.language === "tl" ? "Taglish" : "English"}.`, "ok");
    render();
  });
  const setChangePw = document.getElementById("set-change-pw-btn");
  if (setChangePw) setChangePw.onclick = () => {
    const cur = document.getElementById("set-cur-pw")?.value || "";
    const nw = document.getElementById("set-new-pw")?.value || "";
    if (!cur) return toast("Enter your current password.", "warn");
    if (nw.length < 12) return toast("New password must be at least 12 characters.", "warn");
    state.settingsPwSaved = true;
    toast("Password changed. Other sessions signed out.", "ok");
    render();
  };
  document.querySelectorAll("[data-set-notif]").forEach(sw => sw.onclick = () => {
    const k = sw.dataset.setNotif;
    state.settingsNotifs[k] = !state.settingsNotifs[k];
    render();
  });
  const setSaveHandoff = document.getElementById("set-save-handoff");
  if (setSaveHandoff) setSaveHandoff.onclick = () => {
    state.settingsQuietHours = Number(document.getElementById("set-quiet")?.value) || 12;
    state.settingsRetentionDays = Math.min(3650, Math.max(1, Number(document.getElementById("set-retain")?.value) || 90));
    toast("Saved conversation handoff defaults.", "ok");
  };

  // Platform Admin events
  const adminWsSearch = document.getElementById("admin-ws-search");
  if (adminWsSearch) adminWsSearch.oninput = e => { state.adminWsQuery = e.target.value; render(); document.getElementById("admin-ws-search")?.focus(); };
  const adminRunState = document.getElementById("admin-run-state");
  if (adminRunState) adminRunState.onchange = e => { state.adminRunFilter = e.target.value; render(); };
  document.querySelectorAll("[data-admin-save-ws]").forEach(btn => btn.onclick = () => {
    const ws = state.adminWorkspaces.find(w => w.id === btn.dataset.adminSaveWs);
    if (!ws) return;
    const planSel = document.querySelector(`[data-admin-plan="${ws.id}"]`);
    const mailIn = document.querySelector(`[data-admin-mail="${ws.id}"]`);
    const nextPlan = planSel ? planSel.value || null : ws.plan;
    const nextMail = mailIn ? Number(mailIn.value) : ws.mailLimit;
    if (nextPlan !== ws.plan) {
      state.adminActions.unshift({ id: `ad-${Date.now()}`, adminEmail: "ops@kymavo.ph", action: "plan", target: ws.email, before: ws.plan ?? "not approved", after: nextPlan ?? "not approved", when: "Just now" });
      ws.plan = nextPlan;
    }
    if (!Number.isNaN(nextMail) && nextMail !== ws.mailLimit) {
      state.adminActions.unshift({ id: `ad-${Date.now()}-m`, adminEmail: "ops@kymavo.ph", action: "shared_mail", target: ws.email, before: `${ws.mailLimit}/day`, after: `${nextMail}/day`, when: "Just now" });
      ws.mailLimit = nextMail;
    }
    toast(`Updated workspace ${ws.org}.`, "ok");
    render();
  });
}

function setTheme(theme) {
  document.documentElement.dataset.theme = theme;
  document.querySelectorAll("[data-theme-btn]").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.themeBtn === theme)));
  if (state.view === "settings") render();
}

document.querySelectorAll(".rail-link[data-nav]").forEach(a => a.onclick = () => navigate(a.dataset.nav, a.dataset.sub));
document.querySelectorAll(".rail-sublink").forEach(a => a.onclick = () => navigate(a.dataset.nav, a.dataset.sub));
document.querySelectorAll(".rail-parent").forEach(btn => btn.onclick = () => {
  const grp = btn.dataset.parent;
  const opening = !state.openGroups[grp];
  state.openGroups[grp] = opening;
  if (opening) {
    if (grp === "bookings" && state.view !== "bookings") return navigate("bookings", state.subTab.bookings);
    if (grp === "automations" && !["automations", "create", "editor"].includes(state.view)) return navigate("automations");
    if (grp === "business" && state.view !== "business") return navigate("business", state.subTab.business);
  }
  syncSidebar();
});
wireShellEvents();
document.querySelectorAll("[data-theme-btn]").forEach(b => b.onclick = () => setTheme(b.dataset.themeBtn));
document.querySelectorAll("[data-mode-btn]").forEach(b => b.onclick = () => {
  document.getElementById("viewport").dataset.mode = b.dataset.modeBtn;
  if (b.dataset.modeBtn !== "phone") setMobileNav(false);
  document.querySelectorAll("[data-mode-btn]").forEach(x => x.setAttribute("aria-pressed", String(x === b)));
});
document.getElementById("mobile-menu-btn")?.addEventListener("click", () => setMobileNav(!state.mobileNavOpen));
document.getElementById("mobile-menu-close")?.addEventListener("click", () => setMobileNav(false));
document.getElementById("mobile-backdrop")?.addEventListener("click", () => setMobileNav(false));
document.getElementById("mobile-search-btn")?.addEventListener("click", () => {
  setMobileNav(false);
  renderCmdList();
  cmd.showModal();
  cmdInput.focus();
});
document.querySelectorAll("[data-motion-btn]").forEach(b => b.onclick = () => {
  document.documentElement.dataset.motion = b.dataset.motionBtn;
  document.querySelectorAll("[data-motion-btn]").forEach(x => x.setAttribute("aria-pressed", String(x === b)));
});

const jumpItems = [
  ["Home", "#/", "home"],
  ["Inbox", "#/inbox", "inbox"],
  ["Bookings · Calendar", "#/bookings", "bookings", "calendar"],
  ["Bookings · Rooms and slots", "#/bookings?tab=rooms", "bookings", "rooms"],
  ["Automations", "#/automations", "automations"],
  ["New automation · Templates", "#/new", "create", "templates"],
  ["Build with AI", "#/ai", "create", "ai"],
  ["Apps", "#/apps", "apps"],
  ["Business · Details and branding", "#/business", "business", "details"],
  ["Business · Knowledge", "#/business?tab=knowledge", "business", "knowledge"],
  ["Business · Team", "#/business?tab=team", "business", "team"],
  ["Settings", "#/settings", "settings"],
  ["Support", "#/support", "support"]
];
const cmd = document.getElementById("cmd-dialog");
const cmdInput = document.getElementById("cmd-input");
function renderCmdList(q = "") {
  const needle = q.trim().toLowerCase();
  const list = document.getElementById("cmd-list");
  list.innerHTML = jumpItems.filter(([label]) => label.toLowerCase().includes(needle)).map(([label, href, view, tab]) =>
    `<button type="button" class="cmd-item" data-jview="${view}" data-jtab="${tab || ""}">${label} <span>${href}</span></button>`
  ).join("");
  list.querySelectorAll("button").forEach(b => b.onclick = () => { navigate(b.dataset.jview, b.dataset.jtab || undefined); cmd.close(); });
}
document.getElementById("open-cmd").onclick = () => { renderCmdList(); cmd.showModal(); cmdInput.focus(); };
cmdInput.oninput = e => renderCmdList(e.target.value);
window.addEventListener("keydown", e => {
  if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === "k") {
    e.preventDefault();
    if (cmd.open) cmd.close();
    else { renderCmdList(); cmd.showModal(); cmdInput.focus(); }
    return;
  }
  if (e.key === "Escape" && state.mobileNavOpen) {
    e.preventDefault();
    setMobileNav(false);
    return;
  }
  if (e.key === "Escape" && state.view === "editor") {
    if (cmd.open) return;
    if (state.editorModal) {
      e.preventDefault();
      state.editorModal = null;
      render();
      return;
    }
    if (state.editorTab === "steps") {
      e.preventDefault();
      if (document.activeElement instanceof HTMLElement && document.activeElement.closest(".ed-side")) {
        document.activeElement.blur();
      }
      state.editorFolded = !state.editorFolded;
      render();
    }
  }
});

bindSlidingPill("#rail-nav", ".rail-link, .rail-sublink", "#rail-pill");
syncSidebar();
render();
</script>
</body>
</html>
